name: Sync dependencies
# Keeps docs/DEPENDENCIES.md (dependency graph, critical path, waves,
# priority table) in sync with the `## Dependencies` sections of the open
# issues in kingdoms-services and kingdoms-infra (see
# docs/SKILLS/update-dependencies.md). Cross-repo issue changes ping this
# workflow via repository_dispatch (dependencies-ping.yml in kingdoms-services
# and kingdoms-infra); the weekly schedule is the safety net.
on:
  issues:
    types: [opened, edited, reopened, closed]
  repository_dispatch:
    types: [dependencies-sync]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: dependencies-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync docs/DEPENDENCIES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_dependencies.py
      - name: Open or update rolling sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/dependencies-sync
        run: |
          set -euo pipefail
          if git diff --quiet docs/DEPENDENCIES.md; then
            echo "DEPENDENCIES.md is up to date; nothing to do"
            exit 0
          fi
          cp docs/DEPENDENCIES.md /tmp/DEPENDENCIES.md.new
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code "origin/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            if gh pr list --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^0$'; then
              echo "Branch exists without an open PR; recreating the PR"
              git push origin --delete "${BRANCH}"
              git checkout -b "${BRANCH}"
            else
              git checkout -B "${BRANCH}" origin/main
            fi
          else
            git checkout -b "${BRANCH}"
          fi
          cp /tmp/DEPENDENCIES.md.new docs/DEPENDENCIES.md
          git add docs/DEPENDENCIES.md
          git commit -m "docs(dependencies): sync dependency graph"
          git push origin "${BRANCH}" --force
          if gh pr list --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^0$'; then
            {
              echo "## Summary"
              echo "- Automated dependency-graph sync: regenerated docs/DEPENDENCIES.md (critical path, waves, priorities) from issue \`## Dependencies\` sections"
              echo ""
              echo "This rolling PR is updated in place by the sync workflow; merge it to clear the drift."
            } > /tmp/pr-body.md
            gh pr create --head "${BRANCH}" --title "docs(dependencies): sync dependency graph" \
              --body-file /tmp/pr-body.md
          else
            gh pr comment "${BRANCH}" --body "Dependency graph re-synced from issue changes."
          fi
