name: Check Docs

# Validates documentation completeness on every PR that touches docs.
# Docstring checks require the kingdoms-services source, which is not part of
# this repository; it is checked out read-only for the validation run. The
# checkout is best-effort: kingdoms-services is a private sibling repo and the
# workflow token may not have access to it; validate_docs.py degrades
# gracefully when the source is absent.

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout kingdoms-services (read-only)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin/kingdoms-services
          path: kingdoms-services
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check documentation completeness
        run: |
          python scripts/validate_docs.py --check \
            --source kingdoms-services/src/kingdoms \
            --config kingdoms-services/config
