name: Generate Docs

# Generates pydoc HTML documentation from the kingdoms-services Python source
# Generates pydoc HTML documentation from the kingdoms-services Python source
# into docs/DEVELOPMENT/pydoc/ and publishes it through a rolling pull request
# on the automation/generated-docs branch (the ruleset on main requires all
# changes to go through a pull request).
# The source is cloned read-only from the kingdoms-services repo because the
# Python code does not live in this repository. The checkout is best-effort:
# kingdoms-services is a private sibling repo and the workflow token may not
# have access to it; generate_pydoc.py exits 0 with a warning when the source
# is absent.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout kingdoms-services (read-only)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin/kingdoms-services
          path: kingdoms-services
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pydoc documentation
        run: |
          python scripts/generate_pydoc.py \
            --source kingdoms-services/src/kingdoms \
            --output docs/DEVELOPMENT/pydoc

      - name: Open or update rolling docs PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/generated-docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT/
          git diff --cached --quiet && echo "No doc changes" && exit 0
          cp -r docs/DEVELOPMENT /tmp/DEVELOPMENT.new
          if git ls-remote --exit-code "origin/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            if gh pr list --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^0$'; then
              git push origin --delete "${BRANCH}"
              git checkout -b "${BRANCH}"
            else
              git checkout -B "${BRANCH}" "origin/${BRANCH}"
            fi
          else
            git checkout -b "${BRANCH}"
          fi
          rm -rf docs/DEVELOPMENT
          cp -r /tmp/DEVELOPMENT.new docs/DEVELOPMENT
          git add docs/DEVELOPMENT
          git commit -m "docs: auto-generate development docs"
          git push origin "${BRANCH}" --force
          if gh pr list --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^0$'; then
            cat > /tmp/pr-body.md <<'EOF_BODY'
          ## Summary
          - Automated regeneration of docs/DEVELOPMENT/pydoc from the kingdoms-services source

          This rolling PR is updated in place by the generate-docs workflow; merge it to publish the generated docs.
          EOF_BODY
            gh pr create --head "${BRANCH}" --title "docs: auto-generate development docs" \
              --body-file /tmp/pr-body.md
          else
            gh pr comment "${BRANCH}" --body "Development docs regenerated from the latest kingdoms-services source."
          fi
