name: Sync roadmap

# Keeps ROADMAP.md in sync with GitHub issue states (see kingdoms#27 and
# docs/SKILLS/update-roadmap.md). Runs scripts/sync_roadmap.py against main
# and, when the roadmap drifted, updates a single rolling PR on the
# automation/roadmap-sync branch instead of pushing to main directly.
# Roadmap statuses are driven by issue state changes only: a merged PR closes
# its linked issue, which fires the `issues` event here. Cross-repo issue
# changes ping this workflow via repository_dispatch (see roadmap-ping.yml in
# kingdoms-services and kingdoms-infra); the weekly schedule is the safety net.
# kingdoms-infra is a private repository, so the GITHUB_TOKEN of this repo
# cannot read its issues: the DEPS_SYNC_PAT secret (fine-grained PAT with
# "Issues: read" on kingdoms-services AND kingdoms-infra) is required so
# roadmap statuses never go stale for kingdoms-infra; the job fails closed
# when the token is missing or a repository is unreadable.

on:
  issues:
    types: [opened, reopened, closed]
  repository_dispatch:
    types: [roadmap-sync]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed when DEPS_SYNC_PAT is not configured
        env:
          PAT_SET: ${{ secrets.DEPS_SYNC_PAT != '' }}
        run: |
          if [ "${PAT_SET}" != "true" ]; then
            echo "::error::DEPS_SYNC_PAT is not set; the roadmap sync needs cross-repo read access to the private kingdoms-infra issues (fine-grained PAT with 'Issues: read' on kingdoms-services AND kingdoms-infra). See docs/SKILLS/update-roadmap.md."
            exit 1
          fi
      - name: Sync ROADMAP.md
        env:
          GITHUB_TOKEN: ${{ secrets.DEPS_SYNC_PAT }}
        run: |
          set -o pipefail
          python scripts/sync_roadmap.py 2>/tmp/sync-warnings.txt | tee /tmp/sync-changes.txt
          cat /tmp/sync-warnings.txt >&2
      - name: Fail on unreadable issue state
        run: |
          if grep -q "not found on GitHub" /tmp/sync-warnings.txt; then
            echo "::error::The GitHub API returned no issue data; refusing to write a roadmap update based on incomplete data"
            exit 1
          fi
          if grep -q "cannot read" /tmp/sync-warnings.txt; then
            echo "::error::A repository was unreadable (check the DEPS_SYNC_PAT secret: fine-grained PAT with 'Issues: read' on kingdoms-services AND kingdoms-infra); refusing to write a roadmap update based on incomplete data"
            cat /tmp/sync-warnings.txt >&2
            exit 1
          fi
      - name: Open or update rolling sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/roadmap-sync
        run: |
          set -euo pipefail
          if git diff --quiet ROADMAP.md; then
            echo "ROADMAP.md is up to date; nothing to do"
            exit 0
          fi
          cp ROADMAP.md /tmp/ROADMAP.md.new
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code "origin/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            if gh pr list --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^0$'; then
              echo "Branch exists without an open PR; recreating the PR"
              git push origin --delete "${BRANCH}"
              git checkout -b "${BRANCH}"
            else
              git checkout -B "${BRANCH}" origin/main
            fi
          else
            git checkout -b "${BRANCH}"
          fi
          cp /tmp/ROADMAP.md.new ROADMAP.md
          git add ROADMAP.md
          git commit -m "docs(roadmap): sync with GitHub issues"
          git push origin "${BRANCH}" --force
          if gh pr list --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^0$'; then
            {
              echo "## Summary"
              echo "- Automated ROADMAP.md sync (kingdoms#27): statuses mapped from GitHub issue states"
              echo ""
              echo "\`\`\`"
              cat /tmp/sync-changes.txt
              echo "\`\`\`"
              echo ""
              echo "This rolling PR is updated in place by the sync workflow; merge it to clear the drift."
            } > /tmp/pr-body.md
            gh pr create --head "${BRANCH}" --title "docs(roadmap): sync with GitHub issues" \
              --body-file /tmp/pr-body.md
          else
            gh pr comment "${BRANCH}" --body "Roadmap drift re-synced (kingdoms#31 resolved — the workflow manages this PR): $(head -1 /tmp/sync-changes.txt)"
          fi
