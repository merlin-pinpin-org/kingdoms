# Regenerate the synced artifacts (ROADMAP.md, docs/DEPENDENCIES.md)
# on main only — never in PRs, never by an agent's hand. The merge that
# closes an issue (or any doc/issue change) is the signal that the
# roadmap may have moved; this workflow is the single writer.
#
# Triggers:
#   push on main          — the post-merge sync wave (every merge)
#   schedule 06:00 UTC    — the daily catch-up (label/mileage edits,
#                           cross-repo issue changes that no push saw)
#   workflow_dispatch     — the on-demand run
#
# The commit is pushed through the kingdoms-deployer App token (the
# same single-writer identity as the state branches); the App must be
# a bypass actor on the main ruleset (AGENTS.md — setup list).
# If the regeneration produces no diff, nothing is committed.
name: Sync generated artifacts

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-generated
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate ROADMAP.md + docs/DEPENDENCIES.md
    runs-on: ubuntu-latest
    steps:
      - name: Mint the kingdoms-deployer App token (single writer)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Regenerate the artifacts
        run: |
          python3 scripts/sync_roadmap.py
          python3 scripts/sync_dependencies.py

      - name: Open a sync PR when the artifacts moved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- ROADMAP.md docs/DEPENDENCIES.md; then
            echo "artifacts up to date — nothing to do"
            exit 0
          fi
          git config user.name "kingdoms-deployer[bot]"
          git config user.email "kingdoms-deployer[bot]@users.noreply.github.com"
          git checkout -b sync/generated-artifacts
          git add ROADMAP.md docs/DEPENDENCIES.md
          git commit -m "chore(sync): regenerate ROADMAP.md + docs/DEPENDENCIES.md"
          git push --force-with-lease origin sync/generated-artifacts
          # One always-fresh branch: each run replaces its own previous PR
          # head. The sync ruleset (path-filtered, no reviews) lets the
          # automerge through; the main ruleset is never bypassed.
          PR_URL="$(gh pr create \
            --title "chore(sync): regenerate ROADMAP.md + docs/DEPENDENCIES.md" \
            --body "Automated regeneration by the \`sync-generated\` workflow (post-merge / daily / on-demand). Never edited by hand — see AGENTS.md and docs/INDEX.md." \
            --base main \
            --head sync/generated-artifacts || true)"
          if [[ -n "${PR_URL}" ]]; then
            gh pr merge --auto --rebase --repo merlin-pinpin-org/kingdoms \
              "$(basename "${PR_URL}")" || true
          else
            # The branch already had an open PR: re-enable automerge on it.
            gh pr merge --auto --rebase --repo merlin-pinpin-org/kingdoms \
              sync/generated-artifacts || true
          fi
