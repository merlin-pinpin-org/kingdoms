name: Check Docs
# Validates documentation completeness on every PR, and that the generated
# docs are fresh. Docstring checks require the kingdoms-services source,
# which is not part of this repository; it is checked out read-only for the
# validation run. The checkout is best-effort: kingdoms-services is a private
# sibling repo and the workflow token may not have access to it;
# validate_docs.py degrades gracefully when the source is absent.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout kingdoms-services (read-only)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin/kingdoms-services
          path: kingdoms-services
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation completeness
        run: |
          python scripts/validate_docs.py --check \
            --source kingdoms-services/src/kingdoms \
            --config kingdoms-services/config
      - name: Check generated docs freshness
        run: |
          python scripts/generate_pydoc.py \
            --source kingdoms-services/src/kingdoms \
            --output /tmp/pydoc-fresh
          if diff -rq /tmp/pydoc-fresh docs/DEVELOPMENT/pydoc \
            --exclude=.gitkeep > /tmp/pydoc-diff.txt 2>&1; then
            echo "Generated docs are fresh"
          else
            echo "::error::docs/DEVELOPMENT/pydoc is stale — run /generate-docs on this PR to regenerate it"
            cat /tmp/pydoc-diff.txt
            exit 1
          fi
