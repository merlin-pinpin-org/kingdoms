name: Authorize PR command
# Roster-based authorization gate for PR-comment keywords (the authority
# matrix in CONTRIBUTORS.md is the source of truth). Any keyword workflow
# (deploy, env-control, release...) calls this reusable workflow first:
# it parses the roster on main, resolves the requestor's entry and the
# PR author's agent-scope, and fails closed with the exact matrix rule.
#
# Keywords and their capability (see the authority matrix):
#   /deploy [env]     -> deploy      (any rostered vibe+; never prod-like)
#   /logs [env] ...   -> env-logs    (ops; dev on test)
#   /dump-db [env]    -> db-dump     (ops)
#   /env <cmd> <env>  -> env-control  (ops; dev on test)
#   /release          -> release      (dev/platform)
#   /rollback <env>   -> rollback     (ops)
#   /sync-teams       -> sync-teams   (platform)
on:
  workflow_call:
    inputs:
      capability:
        description: "Capability to check (deploy, env-control, env-logs, db-dump, release, rollback, sync-teams)"
        required: true
        type: string
      environment:
        description: "Target environment, empty if not env-scoped"
        required: false
        default: ""
        type: string
      requestor:
        description: "Login of the human who posted the command"
        required: true
        type: string
      pr-author:
        description: "Login of the PR author (agent-scope check), empty to skip"
        required: false
        default: ""
        type: string
      pr-number:
        description: "PR number to report the verdict on, empty to skip reporting"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  authorize:
    name: Roster gate (${{ inputs.capability }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out the roster (kingdoms main — the source of truth)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms
          ref: main
          sparse-checkout: |
            CONTRIBUTORS.md
            scripts/roster.py

      - name: Apply the authority matrix
        id: matrix
        run: |
          set -euo pipefail
          set +e
          result="$(python3 scripts/roster.py \
            "${{ inputs.requestor }}" \
            "${{ inputs.capability }}" \
            --env "${{ inputs.environment }}" \
            ${{ inputs.pr-author != '' && format('--pr-author {0}', inputs.pr-author) || '' }})"
          code=$?
          set -e
          echo "$result"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "verdict=$(echo "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ALLOWED" if d["allowed"] else "DENIED")')"
            echo "reason=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reason"])')"
            echo "alias=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["alias"])')"
          } >> "$GITHUB_OUTPUT"
          exit $code
      - name: Report the verdict on the PR (alias-first)
        if: always() && inputs.pr-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const alias = "${{ steps.matrix.outputs.alias }}";
            const verdict = "${{ steps.matrix.outputs.verdict }}";
            const reason = "${{ steps.matrix.outputs.reason }}";
            const icon = verdict === "ALLOWED" ? "✅" : "⛔";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr-number }},
              body: `${icon} **${alias}** — ${verdict === "ALLOWED" ? "authorized" : "not authorized"}: ${reason}`,
            });
