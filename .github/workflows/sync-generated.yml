# Regenerate the synced artifacts (generated/ROADMAP.md,
# generated/DEPENDENCIES.md, generated/pydoc/ — the kingdoms-services
# Python API doc, copied from that repo's committed pydoc which its own
# CI keeps fresh) and publish them on the sync/generated-artifacts
# branch — never in PRs, never by an agent's hand, never on main. The
# merge that closes an issue (or any doc/issue change) is the signal
# that the roadmap may have moved; this workflow is the single writer.
#
# Triggers:
#   push on main          — the post-merge sync wave (every merge)
#   schedule 06:00 UTC    — the daily catch-up (label/milestone edits,
#                           cross-repo issue changes that no push saw)
#   workflow_dispatch     — the on-demand run
#
# The push targets a dedicated branch, not main: GitHub Apps cannot be
# ruleset bypass actors, and the zero-click requirement means no PR and
# no review — so the generated files left main's tree entirely.
# If the regeneration produces no diff, nothing is pushed.
name: Sync generated artifacts

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-generated
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate generated/ (roadmap, dependencies, pydoc)
    runs-on: ubuntu-latest
    steps:
      - name: Mint the kingdoms-deployer App token (single writer)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms

      - name: Check out kingdoms (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: kingdoms
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # kingdoms-services is public — checked out anonymously, no token
      # needed; the App installation does not cover it.
      - name: Check out kingdoms-services (main, pydoc source)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms-services
          ref: main
          path: kingdoms-services

      - name: Restore the previous generated state (bootstrap included)
        working-directory: kingdoms
        run: |
          # sync_roadmap rewrites the file in place, so it needs the
          # previous generated state. It lives on the sync branch; when
          # the branch does not exist yet (first run), bootstrap from
          # the last main revision that still carried the files.
          mkdir -p generated
          if git fetch origin sync/generated-artifacts \
              && git show origin/sync/generated-artifacts:generated/ROADMAP.md > generated/ROADMAP.md 2>/dev/null \
              && git show origin/sync/generated-artifacts:generated/DEPENDENCIES.md > generated/DEPENDENCIES.md 2>/dev/null; then
            echo "restored the generated state from sync/generated-artifacts"
          else
            echo "sync branch absent — bootstrapping from the last main revisions"
            # The last commit touching ROADMAP.md may be the removal commit;
            # walk back until a revision that actually contains the file.
            base=""
            for c in $(git rev-list --all -- ROADMAP.md); do
              if git cat-file -e "$c":ROADMAP.md 2>/dev/null; then base=$c; break; fi
            done
            [ -n "$base" ] || { echo "no previous ROADMAP.md found anywhere"; exit 1; }
            git show "$base":ROADMAP.md > generated/ROADMAP.md
            git show "$base":docs/DEPENDENCIES.md > generated/DEPENDENCIES.md
          fi
          # Stage the restored state so the publish step can diff against
          # it (the regenerated files are otherwise untracked and the
          # no-diff test would always pass).
          git add generated/

      - name: Regenerate the artifacts
        working-directory: kingdoms
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 .github/workflows/scripts/sync_roadmap.py
          python3 .github/workflows/scripts/sync_dependencies.py
          # pydoc: kingdoms-services commits its own generated pydoc and
          # its CI (docs.yml) fails when it is stale — copying it is both
          # cheaper and always as fresh as that repo's main.
          rm -rf generated/pydoc
          cp -r ../kingdoms-services/docs/DEVELOPMENT/pydoc generated/pydoc

      - name: Publish the regenerated artifacts on the sync branch
        working-directory: kingdoms
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "kingdoms-deployer[bot]"
          git config user.email "kingdoms-deployer[bot]@users.noreply.github.com"
          if git diff --quiet --cached -- generated/ && git diff --quiet -- generated/; then
            echo "artifacts up to date — nothing to do"
            exit 0
          fi
          git checkout -q -B sync/generated-artifacts
          git add generated/
          git commit -m "chore(sync): regenerate generated/ (roadmap, dependencies, pydoc)"
          git push --force origin sync/generated-artifacts
