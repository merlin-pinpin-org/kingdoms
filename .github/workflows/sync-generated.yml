# Regenerate the synced artifacts (ROADMAP.md, docs/DEPENDENCIES.md)
# and publish them on the sync/generated-artifacts branch — never in
# PRs, never by an agent's hand, never on main. The merge that closes
# an issue (or any doc/issue change) is the signal that the roadmap may
# have moved; this workflow is the single writer.
#
# Triggers:
#   push on main          — the post-merge sync wave (every merge)
#   schedule 06:00 UTC    — the daily catch-up (label/mileage edits,
#                           cross-repo issue changes that no push saw)
#   workflow_dispatch     — the on-demand run
#
# The push targets a dedicated branch, not main: GitHub Apps cannot be
# ruleset bypass actors, and the zero-click requirement means no PR and
# no review — so the generated files left main's tree entirely.
# If the regeneration produces no diff, nothing is pushed.
name: Sync generated artifacts

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-generated
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate ROADMAP.md + docs/DEPENDENCIES.md
    runs-on: ubuntu-latest
    steps:
      - name: Mint the kingdoms-deployer App token (single writer)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Restore the previous generated state (bootstrap included)
        run: |
          # sync_roadmap rewrites the file in place, so it needs the previous
          # generated state. It lives on the sync branch; when the branch does
          # not exist yet (first run), bootstrap from the last main version
          # (the files left main in #145).
          if git fetch origin sync/generated-artifacts \
              && git show origin/sync/generated-artifacts:ROADMAP.md > ROADMAP.md \
              && git show origin/sync/generated-artifacts:docs/DEPENDENCIES.md > docs/DEPENDENCIES.md; then
            echo "restored the generated state from sync/generated-artifacts"
          else
            echo "sync branch absent — bootstrapping from the last main revision"
            git show $(git rev-list --all --max-count=1 -- ROADMAP.md):ROADMAP.md > ROADMAP.md \
              || { echo "no previous ROADMAP.md found anywhere"; exit 1; }
            git show $(git rev-list --all --max-count=1 -- docs/DEPENDENCIES.md):docs/DEPENDENCIES.md > docs/DEPENDENCIES.md \
              || { echo "no previous docs/DEPENDENCIES.md found anywhere"; exit 1; }
          fi
      - name: Regenerate the artifacts
        run: |
          python3 scripts/sync_roadmap.py
          python3 scripts/sync_dependencies.py

      - name: Publish the regenerated artifacts on the sync branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- ROADMAP.md docs/DEPENDENCIES.md; then
            echo "artifacts up to date — nothing to do"
            exit 0
          fi
          git config user.name "kingdoms-deployer[bot]"
          git config user.email "kingdoms-deployer[bot]@users.noreply.github.com"
          # The generated artifacts live on sync/generated-artifacts
          # (always current, rebuilt from main): main never carries them,
          # so no ruleset review is ever asked and no human ever clicks.
          git checkout -B sync/generated-artifacts
          git add ROADMAP.md docs/DEPENDENCIES.md
          git commit -m "chore(sync): regenerate ROADMAP.md + docs/DEPENDENCIES.md"
          git push --force origin sync/generated-artifacts
